<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Niflheim - Data Poisoning Control</title>
  <style>
    :root {
      --bg-primary: #1a1a2e;
      --bg-secondary: #16213e;
      --accent: #e94560;
      --text-primary: #ffffff;
      --text-secondary: #a0a0a0;
      --success: #4ade80;
      --warning: #fbbf24;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      width: 400px;
      padding: 20px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--accent);
    }
    
    .header h1 {
      font-size: 24px;
      color: var(--accent);
      margin-bottom: 5px;
    }
    
    .header p {
      font-size: 12px;
      color: var(--text-secondary);
    }
    
    .status-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      padding: 10px;
      background: var(--bg-secondary);
      border-radius: 8px;
    }
    
    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
    }
    
    .status-dot.inactive {
      background: var(--warning);
      animation: none;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .control-section {
      margin-bottom: 20px;
      padding: 15px;
      background: var(--bg-secondary);
      border-radius: 8px;
    }
    
    .control-section h2 {
      font-size: 16px;
      margin-bottom: 15px;
      color: var(--accent);
    }
    
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    
    .toggle-label {
      font-size: 14px;
    }
    
    .toggle-switch {
      position: relative;
      width: 50px;
      height: 26px;
    }
    
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.3s;
      border-radius: 26px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: var(--accent);
    }
    
    input:checked + .slider:before {
      transform: translateX(24px);
    }
    
    .slider-row {
      margin: 15px 0;
    }
    
    .slider-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }
    
    input[type="range"] {
      width: 100%;
      height: 6px;
      background: #333;
      outline: none;
      border-radius: 3px;
    }
    
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      background: var(--accent);
      cursor: pointer;
      border-radius: 50%;
    }
    
    select {
      width: 100%;
      padding: 8px;
      background: var(--bg-primary);
      color: var(--text-primary);
      border: 1px solid #333;
      border-radius: 4px;
      font-size: 14px;
    }
    
    .log-section {
      max-height: 200px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      background: #000;
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
    }
    
    .log-entry {
      margin-bottom: 5px;
      padding: 5px;
      border-left: 2px solid var(--accent);
      padding-left: 8px;
    }
    
    .log-timestamp {
      color: var(--text-secondary);
      font-size: 10px;
    }
    
    .button {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 10px;
      transition: background 0.3s;
    }
    
    .button:hover {
      background: #d6344f;
    }
    
    .button.secondary {
      background: #333;
    }
    
    .button.secondary:hover {
      background: #444;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    
    .stat-card {
      background: var(--bg-primary);
      padding: 10px;
      border-radius: 4px;
      text-align: center;
    }
    
    .stat-value {
      font-size: 20px;
      font-weight: bold;
      color: var(--accent);
    }
    
    .stat-label {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🛡️ Niflheim</h1>
    <p>Data Poisoning Defense System</p>
  </div>
  
  <div class="status-indicator">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Protection Active</span>
  </div>
  
  <div class="control-section">
    <h2>Core Settings</h2>
    
    <div class="toggle-row">
      <span class="toggle-label">Enable Protection</span>
      <label class="toggle-switch">
        <input type="checkbox" id="protectionToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    
    <div class="toggle-row">
      <span class="toggle-label">Share Threat Data</span>
      <label class="toggle-switch">
        <input type="checkbox" id="sharingToggle">
        <span class="slider"></span>
      </label>
    </div>
    
    <div class="slider-row">
      <div class="slider-label">
        <span>Poisoning Threads</span>
        <span id="threadValue">2</span>
      </div>
      <input type="range" id="threadSlider" min="1" max="8" value="2">
    </div>
    
    <div style="margin-top: 15px;">
      <label style="font-size: 14px; display: block; margin-bottom: 8px;">Target Country</label>
      <select id="countrySelect">
        <option value="USA">United States</option>
        <option value="CAN">Canada</option>
        <option value="GBR">United Kingdom</option>
        <option value="AUS">Australia</option>
        <option value="DEU">Germany</option>
        <option value="FRA">France</option>
      </select>
    </div>
  </div>
  
  <div class="control-section">
    <h2>Activity Stats</h2>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="trackersDetected">0</div>
        <div class="stat-label">Trackers Detected</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="cookiesPoisoned">0</div>
        <div class="stat-label">Cookies Poisoned</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="formsPoisoned">0</div>
        <div class="stat-label">Forms Poisoned</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="fingerprintsBlocked">0</div>
        <div class="stat-label">Fingerprints Blocked</div>
      </div>
    </div>
  </div>
  
  <div class="control-section">
    <h2>Recent Activity</h2>
    <button class="button secondary" id="refreshLogBtn">Refresh Log</button>
    <div class="log-section" id="activityLog">
      <div class="log-entry">
        <div class="log-timestamp">No activity yet</div>
      </div>
    </div>
    <button class="button secondary" id="clearLogBtn" style="margin-top: 10px;">Clear Log</button>
  </div>
  
  <button class="button" id="generateIdentityBtn">Generate Synthetic Identity</button>
  
  <script src="popup.js"></script>
</body>
</html>
