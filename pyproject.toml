[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "niflheim"
version = "1.0.0"
description = "Educational data poisoning toolkit for ML security awareness - inspired by Addie LaMarr's research"
readme = "README.md"
license = {text = "AGPL-3.0"}
authors = [
    {name = "Connor Gill", email = "cgill@darkempire.io"}
]
maintainers = [
    {name = "DARK EMPIRE Research", email = "research@darkempire.io"}
]
keywords = [
    "data-poisoning",
    "adversarial-ml",
    "machine-learning-security",
    "educational",
    "privacy",
    "surveillance",
    "maw-installation"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
    "Topic :: Privacy :: Anonymization"
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pillow>=9.5.0",
    "requests>=2.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.0.260",
    "mypy>=1.0.0"
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "myst-parser>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/darkempire/niflheim"
Documentation = "https://github.com/darkempire/niflheim/tree/main/docs"
Repository = "https://github.com/darkempire/niflheim"
Issues = "https://github.com/darkempire/niflheim/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["maw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
